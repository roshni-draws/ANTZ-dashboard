<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTZ · Module widgets</title>
<!--
  Every ANTZ module as a widget, in the Style 6 look (index.html): mint page, floating white header,
  20px cards, Inter, lime-ink accents, and Style 6's coloured cards (cyan, teal, night, lime, peach).
  Numbers come from config.js + data.js, the same data the dashboards use.
-->
<script src="config.js?v=20261102i"></script>
<script src="data.js?v=20261102i"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300..500,0..1,0&display=block" rel="stylesheet">
<style>
:root {
  --bg: #DDEFE4; --canvas: #F4F6F5; --paper: #FFFFFF;
  --ink: #0E1512; --ink-2: #44544A; --mute: #7A8684; --line: #DAE7DF; --line-2: #EDF2EF;
  --lime: #52F990; --lime-soft: #D9FBE6; --lime-ink: #006D35;
  --coral: #FA6140; --coral-3: #FFEBE5; --teal: #00ABAB; --sky: #00AFD6; --navy: #1F415B; --butter: #FFF4D9;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --sh: 0 1px 2px rgba(0, 60, 30, .05), 0 12px 28px -20px rgba(0, 60, 30, .4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 400 14px/1.4 Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; border-radius: 8px; }
.ms { font-family: 'Material Symbols Outlined'; font-size: 20px; line-height: 1; width: 20px; display: inline-block; overflow: hidden; flex: none; font-variation-settings: 'wght' 400, 'FILL' 1, 'opsz' 20; user-select: none; }
.num { font-variant-numeric: tabular-nums; }

/* shell */
.wrap { padding: 18px; max-width: 1680px; margin: 0 auto; }
.hbar { position: sticky; top: 18px; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 14px 18px 14px 20px; border-radius: 22px; background: #fff; box-shadow: 0 0 0 18px var(--bg), 0 1px 2px rgba(0, 40, 20, .04), 0 10px 26px -22px rgba(0, 40, 20, .4); }
.back { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--canvas); color: var(--ink-2); transition: background .15s; }
.back:hover { background: var(--line-2); color: var(--ink); }
.ttl { margin-right: auto; }
.ttl b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.ttl small { color: var(--mute); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px 0 8px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.pill__pin { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--lime-ink); color: #fff; }
.pill__pin .ms { font-size: 16px; width: 16px; }
.pill select { appearance: none; font-weight: 600; outline: none; cursor: pointer; padding-right: 4px; }
.search { display: flex; align-items: center; gap: 10px; height: 42px; width: 280px; padding: 0 16px; border-radius: 999px; background: var(--canvas); color: var(--mute); }
.search input { flex: 1; min-width: 0; outline: none; color: var(--ink); }
.search input::placeholder { color: var(--mute); }

.panel { margin-top: 16px; padding: 22px; border-radius: 26px; background: var(--canvas); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; background: #fff; color: var(--ink-2); font-weight: 500; font-size: 13px; box-shadow: inset 0 0 0 1px var(--line); transition: background .15s, color .15s; }
.chip span { margin-left: 6px; font-size: 12px; color: var(--mute); }
.chip[aria-pressed="true"] { background: var(--lime-ink); color: #fff; box-shadow: none; }
.chip[aria-pressed="true"] span { color: rgba(255, 255, 255, .75); }
.grp { display: flex; align-items: baseline; gap: 10px; margin: 26px 2px 12px; }
.grp h2 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.grp span { font-size: 13px; color: var(--mute); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.empty { padding: 48px 0; text-align: center; color: var(--mute); }

/* the widget card */
.w { position: relative; display: flex; flex-direction: column; gap: 14px; min-height: 300px; padding: 20px; border-radius: 20px; background: #fff; box-shadow: var(--sh); overflow: hidden; animation: rise .4s var(--ease) both; }
.w--wide { grid-column: span 2; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.w__hd { display: flex; align-items: center; gap: 12px; }
.w__ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 16%, #fff); color: color-mix(in srgb, var(--c) 72%, #000); }
.w__t { min-width: 0; margin-right: auto; }
.w__t b { display: block; font-size: 15px; font-weight: 600; }
.w__t small { display: block; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.go { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink); transition: background .15s; }
.go:hover { background: var(--canvas); }
.go .ms { font-size: 18px; width: 18px; font-variation-settings: 'wght' 400, 'FILL' 0; }
.w__k { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.w__k b { font: 300 46px/1 Inter, system-ui, sans-serif; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.w__k span { color: var(--ink-2); font-size: 14px; }
.w__trend { font-size: 12.5px; color: var(--mute); margin-top: -8px; }
.w__foot { margin-top: auto; }

/* style-6 tones */
.t-cyan, .t-teal, .t-night, .t-navy, .t-coral, .t-deep { color: #fff; --ink-2: rgba(255, 255, 255, .85); --mute: rgba(255, 255, 255, .72); --line: rgba(255, 255, 255, .28); --line-2: rgba(255, 255, 255, .16); }
.t-cyan { background: radial-gradient(90% 80% at 100% 0%, #5FD3F5 0%, transparent 60%), linear-gradient(160deg, #13A0CF, #0A7FAE); box-shadow: 0 14px 30px -18px #0A7FAE; }
.t-teal { background: radial-gradient(80% 90% at 100% 0%, #3FD3C9 0%, transparent 60%), linear-gradient(160deg, #11A79F, #0B8580); box-shadow: 0 14px 30px -18px #0B8580; }
.t-night { background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 14px), #231F2B; }
.t-navy { background: radial-gradient(80% 90% at 100% 0%, #4E7896 0%, transparent 60%), linear-gradient(160deg, #2A4E6A, #1B3448); box-shadow: 0 14px 30px -18px #1B3448; }
.t-coral { background: radial-gradient(80% 90% at 100% 0%, #FFB29C 0%, transparent 60%), linear-gradient(160deg, #F06A4C, #D44B2F); box-shadow: 0 14px 30px -18px #D44B2F; }
.t-deep { background: radial-gradient(80% 90% at 100% 0%, #3E9D6C 0%, transparent 60%), linear-gradient(160deg, #1D7E4C, #0F5A34); box-shadow: 0 14px 30px -18px #0F5A34; }
.t-lime { background: linear-gradient(115deg, #EEFBF2 0%, #BFF0CC 55%, #86E39E 100%); }
.t-egg { background: radial-gradient(60% 120% at 0% 100%, #CDEFFB 0%, transparent 60%), radial-gradient(50% 110% at 30% 100%, #D9F7DF 0%, transparent 60%), radial-gradient(45% 100% at 100% 50%, #FFE0D3 0%, transparent 65%), #FAFBFA; }
.t-butter { background: linear-gradient(160deg, #FFF8E6, #FFF1CF); }
.t-dew { background: radial-gradient(70% 90% at 100% 100%, #D7F6E3 0%, transparent 70%), #fff; }
.t-cyan .w__ic, .t-teal .w__ic, .t-night .w__ic, .t-navy .w__ic, .t-coral .w__ic, .t-deep .w__ic { background: rgba(255, 255, 255, .18); color: #fff; }
.t-cyan .go, .t-teal .go, .t-night .go, .t-navy .go, .t-coral .go, .t-deep .go { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .5); }
.t-night .w__k b { color: #FFAE97; }
.t-lime .go { box-shadow: inset 0 0 0 1.5px #0E2A18; }

/* charts, the style-6 way */
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; height: 150px; }
.bars > div { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.bars b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bars span { position: relative; flex: 1; width: 100%; max-width: 40px; border-radius: 10px; background: color-mix(in srgb, currentColor 10%, transparent); overflow: hidden; }
.bars i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 10px; background: color-mix(in srgb, var(--c) 45%, #fff); }
.bars > div:last-child i { background: var(--c); }
.bars small { width: 100%; font-size: 10.5px; color: var(--mute); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-cyan .bars i, .t-teal .bars i, .t-night .bars i, .t-navy .bars i, .t-coral .bars i, .t-deep .bars i { background: rgba(255, 255, 255, .55); }
.t-cyan .bars > div:last-child i, .t-teal .bars > div:last-child i, .t-night .bars > div:last-child i, .t-navy .bars > div:last-child i, .t-coral .bars > div:last-child i, .t-deep .bars > div:last-child i { background: #fff; }
.pct span { background: repeating-linear-gradient(0deg, var(--line-2) 0 6px, transparent 6px 9px); }
.pct i { background: #CDEFD6; }
.pct .best i { background: linear-gradient(180deg, #6EE79A, #3DCB72); }
.pct .best b { color: #1E8F4E; }
.pct .low i { background: #FFB9A3; }
.pct .low b { color: var(--coral); }
.bars.pct > div:last-child i { background: #CDEFD6; }
.bars.pct > div.low i { background: #FFB9A3; }
.bars.pct > div.best i { background: linear-gradient(180deg, #6EE79A, #3DCB72); }
.area { position: relative; height: 150px; }
.area svg { width: 100%; height: 100%; display: block; overflow: visible; }
.area .ln { fill: none; stroke: var(--c); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.area .fl { fill: var(--c); opacity: .14; }
.area .dt { fill: #fff; stroke: var(--c); stroke-width: 2.5; }
.area .gl { stroke: var(--line-2); }
.area .ax { font-size: 10.5px; fill: var(--mute); }
.t-cyan .area .ln, .t-teal .area .ln, .t-night .area .ln, .t-navy .area .ln, .t-coral .area .ln, .t-deep .area .ln { stroke: #fff; }
.t-cyan .area .fl, .t-teal .area .fl, .t-night .area .fl, .t-navy .area .fl, .t-coral .area .fl, .t-deep .area .fl { fill: #fff; }
.t-cyan .area .dt, .t-teal .area .dt, .t-navy .area .dt, .t-coral .area .dt, .t-deep .area .dt { fill: color-mix(in srgb, #000 25%, var(--c)); stroke: #fff; }
.t-night .area .dt { fill: #231F2B; stroke: #fff; }
.rank { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.rank li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; }
.rank li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.rank li b { font-weight: 600; font-variant-numeric: tabular-nums; }
.rank em { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
.rank em i { display: block; height: 100%; border-radius: 999px; background: color-mix(in srgb, var(--c) 70%, #fff); }
.rank li:first-child em i { background: var(--c); }
.rank li.low b { color: var(--coral); }
.t-cyan .rank em i, .t-teal .rank em i, .t-night .rank em i, .t-navy .rank em i, .t-coral .rank em i, .t-deep .rank em i { background: rgba(255, 255, 255, .6); }
.tiles { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 10px; }
.tiles > div { padding: 12px 14px; border-radius: 14px; background: var(--canvas); }
.t-cyan .tiles > div, .t-teal .tiles > div, .t-night .tiles > div, .t-navy .tiles > div, .t-coral .tiles > div, .t-deep .tiles > div { background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
.t-lime .tiles > div, .t-egg .tiles > div, .t-butter .tiles > div { background: rgba(255, 255, 255, .7); }
.tiles b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tiles small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); margin-top: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.prog { height: 12px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, #fff), var(--c)); }
.t-navy .prog i, .t-deep .prog i { background: linear-gradient(90deg, #A7F9C6, var(--lime)); }
.gauge { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: var(--ink-2); }
.heat { display: grid; grid-template-columns: 28px repeat(var(--cols), minmax(0, 1fr)); gap: 4px; }
.heat i { height: 16px; border-radius: 5px; background: var(--c); }
.heat small { font-size: 10px; color: var(--mute); align-self: center; }
.leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.leg span { display: inline-flex; align-items: center; gap: 6px; }
.srows { display: flex; flex-direction: column; gap: 9px; }
.srows > div { display: grid; grid-template-columns: 110px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 12.5px; }
.srows span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.srows em { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line-2); }
.srows em i { display: block; height: 100%; }
.srows b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.list { list-style: none; }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-2); font-size: 13px; }
.list li:first-child { border-top: 0; }
.list li span { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.list li b { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rows { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.rows li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.rows img, .rows .ph { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; background: var(--canvas); display: grid; place-items: center; color: var(--mute); }
.rows b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows small { display: block; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows time, .rows .badge { font-size: 12px; color: var(--mute); white-space: nowrap; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; background: var(--coral); color: #fff !important; font-weight: 700; font-size: 11px !important; }
.photo { position: relative; height: 150px; border-radius: 14px; overflow: hidden; background: var(--canvas); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo span { position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .92); font-size: 11px; font-weight: 600; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acts a { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); font-weight: 600; font-size: 13px; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 112px; gap: 10px; overflow-x: auto; scrollbar-width: none; }
.strip a { position: relative; height: 140px; border-radius: 14px; overflow: hidden; background: var(--canvas); }
.strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.strip span { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 8px; background: linear-gradient(0deg, rgba(8, 16, 12, .75), transparent); color: #fff; font-size: 11.5px; font-weight: 600; line-height: 1.25; }
.strip .ph { display: grid; place-items: center; color: var(--mute); height: 100%; }
.strip .ph + span { background: none; color: var(--ink); }


/* ---- building blocks for the module widgets (app-accurate states) ---- */
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--line-2); gap: 2px; }
.seg button { height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: #fff; color: #0E1512; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.t-cyan .seg, .t-teal .seg, .t-night .seg, .t-navy .seg, .t-coral .seg, .t-deep .seg { background: rgba(255, 255, 255, .14); }
.split { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; }
.split i { display: block; height: 100%; }
.flow { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.flow > div { position: relative; padding: 12px 10px; border-radius: 14px; background: var(--canvas); min-width: 0; }
.flow > div + div::before { content: "chevron_right"; font-family: 'Material Symbols Outlined'; position: absolute; left: -13px; top: 50%; transform: translateY(-50%); width: 16px; font-size: 16px; color: var(--mute); }
.flow b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.flow small { display: block; font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow .on { background: color-mix(in srgb, var(--c) 16%, #fff); }
.flow .on b { color: color-mix(in srgb, var(--c) 75%, #000); }
.t-lime .flow > div, .t-egg .flow > div, .t-butter .flow > div { background: rgba(255, 255, 255, .72); }
.chipc { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--line-2); color: var(--ink-2); }
.chipc.crit { background: #FFE3DB; color: #C23A1E; } .chipc.warn { background: #FFF1D6; color: #9A5B00; } .chipc.ok { background: #DDF6E6; color: #0A6A34; } .chipc.info { background: #DFF2FA; color: #0A6F8F; } .chipc.mute { background: #EEF1F0; color: #5D6A64; } .chipc.violet { background: #ECE9FF; color: #5446C9; }
.stats4 { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 8px; }
.stats4 > div { padding: 10px 12px; border-radius: 14px; background: var(--canvas); min-width: 0; }
.stats4 b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats4 small { display: block; font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats4 .hot b { color: var(--coral); }
.t-cyan .stats4 > div, .t-teal .stats4 > div, .t-night .stats4 > div, .t-navy .stats4 > div, .t-coral .stats4 > div, .t-deep .stats4 > div { background: rgba(255, 255, 255, .14); }
.t-cyan .stats4 .hot b, .t-teal .stats4 .hot b, .t-navy .stats4 .hot b, .t-coral .stats4 .hot b, .t-deep .stats4 .hot b { color: #FFD9CC; }
.t-night .stats4 .hot b { color: #FFAE97; }
.t-lime .stats4 > div, .t-egg .stats4 > div, .t-butter .stats4 > div { background: rgba(255, 255, 255, .72); }
.ringrow { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 112px; height: 112px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 12; }
.ring .bg { stroke: var(--line-2); }
.ring > span { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 11px; color: var(--mute); line-height: 1.2; }
.ring b { display: block; font-size: 22px; font-weight: 600; color: inherit; font-variant-numeric: tabular-nums; }
.t-teal .ring b { color: #fff; }
.ringleg { list-style: none; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.ringleg li { display: flex; align-items: center; gap: 8px; }
.ringleg li span { flex: 1; color: var(--ink-2); }
.ringleg li b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tagcloud { display: flex; flex-wrap: wrap; gap: 8px; }
.tagcloud span { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 8px; border-radius: 999px; background: color-mix(in srgb, var(--tc) 14%, #fff); color: color-mix(in srgb, var(--tc) 70%, #000); font-size: 12.5px; font-weight: 600; }

<body>
<div class="wrap">

</div>

<script>
(function () {
  var CFG = window.ANTZ_CONFIG, DATA = window.ANTZ_DATA, D = CFG.data || {}, IMG = CFG.images || {};

  var ORDER = ['Animals', 'Medical & care', 'Antz Kitchen', 'Operations', 'Team', 'Records', 'Admin'];

  /* Module names and one-liners as the ANTZ mobile app has them (github.com/ANTZ-Systems/antz_mobile_app).

    animals: ['Animals', 'Single and group animals, by sex and status'],
    housing: ['Housing', 'Sites, sections and enclosures'],
    natality: ['Natality', 'Births recorded'],
    training: ['Training', 'Sessions and their progress'],
    'k-diet': ['Diet', 'By species, directory and changes'],
    'k-kitchen': ['Kitchen', 'Prep sheet, packing stations, keeper areas'],
    'k-inventory': ['Inventory', 'Stock, goods received, vendors'],
    'k-invoices': ['Invoices', 'Receipt reconciliation'],
    'k-procurement': ['Procurement', 'Weekly and monthly plans, forecast'],
    'k-mis': ['MIS', 'Coverage, receiving, wastage, gate'],
    'k-gate': ['Gate & Security', 'Gate visits'],
    'k-admin': ['Kitchen Admin', 'Users, roles, audit reports, kiosk logs'],
    mortality: ['Mortality', 'Deaths, approvals and carcass transfers'],
    necropsy: ['Necropsy', 'Requests, drafts and reports'],
    eggs: ['Eggs', 'Collected, nest box, nursery, hatched'],
    fetal: ['Fetal Death', 'Still births and abortions'],
    tags: ['Tags', 'Public and private labels'],
    medical: ['Medical Record', 'Active and closed cases'],
    administer: ['Administer', 'Today’s doses'],
    diet: ['Species Diet', 'Species with and without a diet'],
    lab: ['Lab', 'Requests and samples'],
    pharmacy: ['Pharmacy', 'Store requests and dispensing'],
    approvals: ['Approval Task', 'Animal transfer requests'],
    audit: ['Enclosure Audit', 'Headcount verification'],
    reports: ['Reports', 'Insights by site and species'],
    security: ['Security', 'Transfer checkpoint by site'],
    compliance: ['Compliance', 'Organisations and their holdings'],
    notes: ['Notes', 'Observations, by priority'],
    announcements: ['Announcements', 'News for your sites and roles'],
    communication: ['Communication', 'Chats and groups'],
    focus: ['My Focus Hub', 'Favourites, bookmarks and folders'],
    help: ['Requests', 'Help desk requests and approvals'],
    users: ['Users', 'Staff, roles and activity']

  /* Natality and Training are modules in the app but not in config.js */
  var apps = (CFG.modules || []).concat([{ id: 'natality', name: 'Natality', icon: 'child_care', colour: '#37BD69', group: 'Animals' }, { id: 'training', name: 'Training', icon: 'model_training', colour: '#7B6CF0', group: 'Animals' }]);
  /* Antz Kitchen (kitchen.dev.antzsystems.com): the web console behind Diet. Built from its menus; numbers are samples */
  apps = apps.concat([
    { id: 'k-diet', icon: 'restaurant', colour: '#1E8F5A', group: 'Antz Kitchen', kitchen: 1 },
    { id: 'k-kitchen', icon: 'skillet', colour: '#C98A12', group: 'Antz Kitchen', kitchen: 1 },
    { id: 'k-inventory', icon: 'inventory_2', colour: '#3E6E8E', group: 'Antz Kitchen', kitchen: 1 },
    { id: 'k-invoices', icon: 'receipt_long', colour: '#4F5D66', group: 'Antz Kitchen', kitchen: 1 },
    { id: 'k-procurement', icon: 'local_shipping', colour: '#2C7A7B', group: 'Antz Kitchen', kitchen: 1 },
    { id: 'k-mis', icon: 'monitoring', colour: '#B4466C', group: 'Antz Kitchen', kitchen: 1 },
    { id: 'k-gate', icon: 'shield', colour: '#B3261E', group: 'Antz Kitchen', kitchen: 1 },
    { id: 'k-admin', icon: 'admin_panel_settings', colour: '#C4581F', group: 'Antz Kitchen', kitchen: 1 }
  ]);
  apps.forEach(function (a) { var x = APP[a.id]; if (x) { a.appName = x[0]; a.appSub = x[1]; a.name = a.name || x[0]; } });
  var TONE = { 'k-diet': 't-deep', 'k-kitchen': 't-butter', 'k-gate': 't-night', 'k-mis': 't-dew', animals: 't-cyan', approvals: 't-teal', mortality: 't-night', housing: 't-lime', eggs: 't-egg', natality: 't-dew', diet: 't-coral', compliance: 't-navy', collections: 't-deep', focus: 't-butter', security: 't-navy', administer: 't-teal' };

  /* sample figures the app tracks but data.js does not: fixed per site, so they never jump on reload */
  function rng(key) { var h = 2166136261; for (var i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); } return function () { h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function sample(mod) { var r = rng(state.site + ':' + mod); return function (a, b) { return Math.floor(a + r() * (b - a + 1)); }; }
  var val = function (mod, key, a, b) { return sample(mod + ':' + key)(a, b); };

  /* animals with photos, from config.js and data.js */
  var SPECIES = D.species || [];
  var POOL = (D.animals || []).map(function (a) { return Object.assign({ sp: SPECIES[0] ? SPECIES[0][0] : '' }, a); });
  Object.keys(DATA.animalsBySpecies || {}).forEach(function (si) { DATA.animalsBySpecies[si].forEach(function (a) { POOL.push(Object.assign({ sp: SPECIES[si][0] }, a)); }); });
  var photo = function (a) { return IMG[a.id] || IMG[a.sp] || ''; };
  var siteName = function () { return DATA.site(state.site).name; };
  var mine = function (list) { var n = siteName(); return state.site === 'all' ? list : list.filter(function (a) { return a.site === n; }).concat(list).slice(0, list.length); };

  $('site').innerHTML = '<option value="all">All sites</option>' + DATA.sites.map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('');

  /* ---- shared pieces ---- */
  function head(a, extra) {
    return '<div class="w__hd"><span class="w__ic"><span class="ms">' + esc(a.icon) + '</span></span><div class="w__t"><b>' + esc(a.appName || a.name) + (a.id === 'natality' || a.id === 'training' ? '<span class="newb">New</span>' : '') + (a.kitchen ? '<span class="kit">Kitchen</span>' : '') + '</b><small>' + esc(a.appSub || a.sub || '') + '</small></div>' +
      (extra || '') + '<a class="go" href="index.html" aria-label="Open ' + esc(a.appName || a.name) + '"><span class="ms">arrow_outward</span></a></div>';
  }
  function big(v, l, t) { return '<div class="w__k"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>' + (t ? '<div class="w__trend">' + t + '</div>' : ''); }
  function tabs(id, opts, cur) { return '<span class="seg" role="group" aria-label="Period">' + opts.map(function (o) { return '<button type="button" data-per="' + id + ':' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</span>'; }
  function per(id, def) { return state.period[id] || def; }
  function split(parts) {
    var t = parts.reduce(function (s, p) { return s + p[1]; }, 0) || 1;
    return '<div class="split" role="img" aria-label="' + esc(parts.map(function (p) { return p[0] + ' ' + p[1]; }).join(', ')) + '">' + parts.map(function (p) { return '<i style="width:' + (p[1] / t * 100).toFixed(1) + '%;background:' + p[2] + '"></i>'; }).join('') + '</div>' +
      '<div class="leg">' + parts.map(function (p) { return '<span><i class="dot" style="background:' + p[2] + '"></i>' + esc(p[0]) + ' <b class="num">' + fmt(p[1]) + '</b></span>'; }).join('') + '</div>';
  }
  function stats4(items) { return '<div class="stats4" style="--n:' + items.length + '">' + items.map(function (x) { return '<div class="' + (x[2] ? 'hot' : '') + '"><b>' + fmt(x[0]) + '</b><small>' + esc(x[1]) + '</small></div>'; }).join('') + '</div>'; }
  function flow(steps, on) { return '<div class="flow" style="--n:' + steps.length + '">' + steps.map(function (x, i) { return '<div class="' + (i === on ? 'on' : '') + '"><b>' + fmt(x[0]) + '</b><small>' + esc(x[1]) + '</small></div>'; }).join('') + '</div>'; }
  function rows(list) { return '<ul class="rowx w__foot">' + list.map(function (x) { return '<li><b>' + x[0] + '</b><small>' + x[1] + '</small>' + (x[2] || '') + '</li>'; }).join('') + '</ul>'; }
  var chip = function (t, cls) { return '<span class="chipc ' + (cls || '') + '">' + esc(t) + '</span>'; };
  var idt = function (id) { return '<span class="idt">' + esc(id) + '</span>'; };
  function bars(items, pct) {
    var mx = Math.max.apply(null, items.map(function (x) { return x[1]; })) || 1;
    return '<div class="bars' + (pct ? ' pct' : '') + '" role="img">' + items.map(function (x, i) {
      var cls = pct ? (x[1] < 60 ? 'low' : i === 0 ? 'best' : '') : '';
      return '<div class="' + cls + '"><b>' + fmt(x[1]) + (pct ? '%' : '') + '</b><span><i style="height:' + Math.max(4, pct ? x[1] : x[1] / mx * 100).toFixed(1) + '%"></i></span><small title="' + esc(x[0]) + '">' + esc(x[0]) + '</small></div>';
    }).join('') + '</div>';
  }
  function rank(c) {
    var top = c.max || Math.max.apply(null, c.bars.map(function (b) { return b[1]; })) || 1;
    return '<ul class="rank">' + c.bars.slice(0, 5).map(function (b) {
      return '<li class="' + (c.warnBelow != null && b[1] < c.warnBelow ? 'low' : '') + '"><span>' + esc(b[0]) + '</span><b>' + fmt(b[1]) + (c.unit || '') + '</b><em><i style="width:' + Math.min(100, b[1] / top * 100).toFixed(1) + '%"></i></em></li>';
    }).join('') + '</ul>';
  }
  function area(series, labels) {
    var W = 320, H = 130, T = 10, B = 22, mx = Math.max.apply(null, series) * 1.15, mn = Math.min.apply(null, series) * .85;
    var x = function (i) { return i * W / (series.length - 1); }, y = function (v) { return T + (1 - (v - mn) / ((mx - mn) || 1)) * (H - T - B); };
    var path = series.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(''), L = series.length - 1;
    var ax = labels.map(function (l, i) { return i % 3 === 0 || i === L ? '<text class="ax" x="' + x(i) + '" y="' + (H - 4) + '" text-anchor="' + (i === 0 ? 'start' : i === L ? 'end' : 'middle') + '">' + esc(l) + '</text>' : ''; }).join('');
    return '<div class="area" style="height:' + H + 'px"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img"><path class="fl" d="' + path + 'L' + W + ' ' + (H - B) + 'L0 ' + (H - B) + 'Z"/><path class="ln" d="' + path + '"/><circle class="dt" cx="' + x(L) + '" cy="' + y(series[L]) + '" r="4.5"/>' + ax + '</svg></div>';
  }
  function ring(parts, centreV, centreL) {
    var t = parts.reduce(function (s, p) { return s + p[1]; }, 0) || 1, C = 2 * Math.PI * 44, off = 0;
    var arcs = parts.map(function (p) { var len = p[1] / t * C, el = '<circle r="44" cx="56" cy="56" stroke="' + p[2] + '" stroke-dasharray="' + len.toFixed(1) + ' ' + (C - len).toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '"/>'; off += len; return el; }).join('');
    return '<div class="ringrow"><div class="ring"><svg viewBox="0 0 112 112" role="img" aria-label="' + esc(parts.map(function (p) { return p[0] + ' ' + p[1]; }).join(', ')) + '"><circle class="bg" r="44" cx="56" cy="56"/>' + arcs + '</svg><span><span><b>' + esc(centreV) + '</b>' + esc(centreL) + '</span></span></div>' +
      '<ul class="ringleg">' + parts.map(function (p) { return '<li><i class="dot" style="background:' + p[2] + '"></i><span>' + esc(p[0]) + '</span><b>' + fmt(p[1]) + '</b></li>'; }).join('') + '</ul></div>';
  }
  var SAMPLE = '<span class="sample">Sample data</span>';

  /* ---- one widget per module, each built around what the app tracks ---- */
  var W = {
    collections: function (a) {
      var m = DATA.site(state.site), r = sample('tax');
      var cls = [['Mammals', .34, '#1D7E4C'], ['Birds', .30, '#46CADE'], ['Reptiles', .18, '#E0A21B'], ['Amphibians', .08, '#8479F9'], ['Fish', .10, '#FB7456']];

        '<ul class="list w__foot">' + parts.map(function (p) { return '<li><span>' + esc(p[0]) + '</span><b>' + fmt(p[1]) + ' species</b></li>'; }).join('') + '</ul>';
    },

        rows(recent.map(function (x) { return [esc(x.n) + ' ' + idt(x.id), esc(x.sp + ' · ' + (x.sex || '') + ' · ' + (x.enc || '').split(' · ').pop()), chip(x.st, x.st === 'Under treatment' ? 'crit' : x.st === 'Quarantine' ? 'warn' : 'ok')]; })) + SAMPLE;
    },
    housing: function (a) {
      var m = DATA.site(state.site), list = state.site === 'all' ? DATA.sites.slice().sort(function (x, y) { return y.animals - x.animals; }).slice(0, 3) : [m];
      return head(a) + '<div class="tiles" style="--n:3"><div><b>' + (state.site === 'all' ? DATA.sites.length : 1) + '</b><small>Sites</small></div><div><b>' + fmt(m.sections) + '</b><small>Sections</small></div><div><b>' + fmt(m.enclosures) + '</b><small>Enclosures</small></div></div>' +
        '<div class="note">' + fmt(m.occupied) + ' of ' + fmt(m.enclosures) + ' enclosures occupied</div>' +
        '<ul class="list w__foot">' + list.map(function (x) { return '<li><span>' + esc(x.name) + ' · ' + x.sections + ' sections · ' + fmt(x.enclosures) + ' enclosures</span><b>' + fmt(x.animals) + '</b></li>'; }).join('') + '</ul>';
    },
    natality: function (a) {
      var p = per('natality', '7'), m = DATA.site(state.site), n = p === '7' ? 1 : p === '30' ? 4 : 12, v = m.series.newAnimals.slice(-n).reduce(function (t, x) { return t + x; }, 0);
      var top = SPECIES.slice(0, 3).map(function (s, i) { return [s[0], Math.max(1, Math.round(v * [.22, .14, .09][i]))]; });
      return head(a, tabs('natality', [['7', '7D'], ['30', '30D'], ['90', '30+']], p)) + big(fmt(v), 'births recorded') +
        '<ul class="rows w__foot">' + top.map(function (t) { var src = IMG[t[0]]; return '<li>' + (src ? '<img src="' + esc(src) + '" alt="">' : '<span class="ph"></span>') + '<span><b>' + esc(t[0]) + '</b><small>Top species this period</small></span><time>' + t[1] + ' births</time></li>'; }).join('') + '</ul>';
    },
    training: function (a) {
      var r = sample('training'), days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      var perDay = days.map(function (d) { return [d, r(4, 18)]; }), week = perDay.reduce(function (t, x) { return t + x[1]; }, 0);
      var month = val('training', 'month', 120, 320);
      var flag = [['Low motivation', 'warn'], ['Not trained ' + r(9, 21) + ' days', 'crit'], ['Not rated yet', 'mute']];
      return head(a) + big(fmt(month), 'sessions this month', (week / 7).toFixed(1) + ' a day, 7-day average') +
        stats4([[val('training', 'animals', 30, 90), 'Animals trained'], [r(40, 120), 'Training hours'], [val('training', 'drafts', 1, 6), 'Drafts to resume', 1]]) +

        rows([['REQ-' + r(1000, 9999) + ' · Water pump, Aviary 2', 'Maintenance · Kai Vance · ' + r(1, 6) + 'd', chip('Emergency', 'crit')], ['REQ-' + r(1000, 9999) + ' · Replace mesh, E7', 'Housing · Meera Pillai · ' + r(2, 9) + 'd', chip('High', 'warn')], ['REQ-' + r(1000, 9999) + ' · Printer toner', 'Admin · Arjun Rao · ' + r(1, 3) + 'd', chip('Normal', 'mute')]]) + SAMPLE;
    },
    users: function (a) {
      var m = DATA.site(state.site), r = sample('users'), team = DATA.team(state.site);
      return head(a) + stats4([[m.staff, 'Users'], [team.onDuty, 'Active today'], [r(0, 4), 'Blocked', 1]]) +
        '<div class="note">Inactive for 7 days or more</div>' +
        rows(team.people.slice(0, 3).map(function (p, i) { return [esc(p.name), esc(p.role + ' · ' + p.site), '<time>' + r(7, 30) + 'd ago</time>']; })) + SAMPLE;
    }
  };

  /* ---- small: the one number that matters, its label, one status ---- */
  function small(a) {
    var m = DATA.site(state.site), one = state.site === 'all' ? DATA.sites.length : 1, ch = '';
    var S = {
      collections: [fmt(m.species), 'species', fmt(m.animals) + ' animals'],
      animals: [fmt(m.animals), 'animals', chip(m.hospital + ' hospitalized', 'warn')],
      housing: [fmt(m.enclosures), 'enclosures', one + ' sites · ' + m.sections + ' sections'],
      natality: [fmt(m.series.newAnimals.slice(-1)[0]), 'births, 7 days', ''],
      'k-diet': [val('k-diet', 'cov', 82, 96) + '%', 'species covered by a diet', val('k-diet', 'chg', 4, 18) + ' changes this week'],
      'k-kitchen': [Math.round(val('k-kitchen', 'packed', 180, 360) / val('k-kitchen', 'plan', 380, 620) * 100) + '%', 'packed today', val('k-kitchen', 'areas', 8, 18) + ' keeper areas'],
      'k-inventory': [fmt(val('k-inventory', 'low', 3, 14)), 'items low on stock', val('k-inventory', 'rej', 0, 4) ? chip(val('k-inventory', 'rej', 0, 4) + ' rejected', 'crit') : ''],
      'k-invoices': [fmt(val('k-invoices', 'pend', 3, 14)), 'receipts to reconcile', chip(val('k-invoices', 'mis', 1, 6) + ' mismatched', 'crit')],
      'k-procurement': [val('k-procurement', 'wk', 55, 95) + '%', 'of this week’s plan ordered', val('k-procurement', 'chg', 2, 9) + ' diet changes to include'],
      'k-mis': [fmt(val('k-mis', 'waste', 60, 260)) + ' kg', 'wastage this week', ''],
      'k-gate': [fmt(val('k-gate', 'inside', 1, 6)), 'vehicles inside now', val('k-gate', 'visits', 12, 40) + ' gate visits today'],
      'k-admin': [fmt(val('k-admin', 'kiosk', 6, 30)), 'kiosk logins today', val('k-admin', 'users', 25, 80) + ' kitchen users'],
      training: [fmt(val('training', 'month', 120, 320)), 'sessions this month', val('training', 'drafts', 1, 6) ? chip(val('training', 'drafts', 1, 6) + (val('training', 'drafts', 1, 6) === 1 ? ' draft' : ' drafts') + ' to resume', 'violet') : ''],
      mortality: [fmt(m.series.mortality.slice(-1)[0]), 'deaths, 7 days', chip(val('mortality', 'appr', 2, 9) + ' to approve', 'crit')],
      necropsy: [fmt(Math.min(m.pending.necropsy, val('necropsy', 'pend', 8, 30))), 'pending necropsies', chip(m.necropsy.drafts + ' drafts', 'mute')],
      eggs: [fmt(m.eggs.incubating), 'eggs in nest box', fmt(m.eggs.hatched + val('eggs', 'hatch', 4, 12)) + ' hatched'],
      fetal: [fmt(val('fetal', 'sb', 1, 6) + val('fetal', 'ab', 0, 4)), 'records this month', val('fetal', 'sb', 1, 6) + ' still births'],
      tags: [fmt(val('tags', 'pub', 18, 40)), 'public tags', ''],
      medical: [fmt(m.inTreatment), 'active cases', chip(m.overdue.followups + ' follow-ups due', 'warn')],
      administer: [fmt(m.vacc.pending + m.deworm.pending), 'doses pending today', fmt(Math.round((m.vacc.done + m.deworm.done) / 7)) + ' administered'],
      diet: [fmt(m.species - Math.round(m.species * .86)), 'species without a diet', ''],
      lab: [fmt(m.pending.lab + m.lab.inProcess), 'requests pending', chip(m.lab.flagged + val('lab', 'high', 1, 4) + ' high priority', 'crit')],
      pharmacy: [fmt(val('pharmacy', 'pend', 4, 16)), 'store requests pending', val('pharmacy', 'disp', 0, 3) ? chip(val('pharmacy', 'disp', 0, 3) + ' disputed', 'crit') : ''],
      approvals: [fmt(Math.max(m.pending.approvals, val('approvals', 'pend', 3, 12))), 'transfers to approve', ''],
      audit: [m.audit + '%', 'enclosures verified', chip(fmt(Math.round(m.enclosures * .03)) + ' discrepancies', 'crit')],
      reports: [fmt(val('reports', 'wastemonth', 40, 400)) + ' kg', 'food wastage this month', ''],
      security: [fmt(val('security', 'out', 2, 9)), 'waiting for checkout', val('security', 'in', 1, 6) + ' waiting for check-in'],
      compliance: ['3', 'organisations', fmt(m.animals) + ' active animals'],
      notes: [fmt(val('notes', 'mine', 2, 6)), 'notes assigned to me', val('notes', 'crit', 0, 3) ? chip(val('notes', 'crit', 0, 3) + ' critical', 'crit') : ''],
      announcements: [String(((D.announcements || []).filter(function (x) { return x.unread; })).length), 'unread announcements', esc(((D.announcements || [])[0] || {}).t || '')],
      communication: [String((D.chats || []).filter(function (x) { return x.unread; }).length), 'unread chats', ''],
      focus: [String((D.saved || []).filter(function (x) { return x.liked; }).length), 'favourites', (D.saved || []).filter(function (x) { return x.bm; }).length + ' bookmarks'],
      help: [fmt(val('help', 'mine', 1, 6)), 'requests for my approval', chip('1 emergency', 'crit')],
      users: [fmt(DATA.team(state.site).onDuty), 'active today', 'of ' + fmt(m.staff) + ' users']
    }[a.id] || ['–', '', ''];
    return '<div class="w__hd"><span class="w__ic"><span class="ms">' + esc(a.icon) + '</span></span><div class="w__t"><b>' + esc(a.appName || a.name) + '</b></div><a class="go" href="index.html" aria-label="Open ' + esc(a.appName || a.name) + '"><span class="ms">arrow_outward</span></a></div>' +
      '<div class="w__k"><b>' + S[0] + '</b></div><div class="w__lbl">' + esc(S[1]) + '</div>' + (S[2] ? '<div class="w__sub">' + S[2] + '</div>' : '');
  }

  function widget(a, i) {
    var fn = W[a.id], body = fn ? fn(a) : head(a) + '<p class="empty">No widget yet</p>';
    return '<article class="w w--l ' + (TONE[a.id] || '') + '" data-mod="' + a.id + '" style="--c:' + esc(a.colour) + ';animation-delay:' + Math.min(i, 12) * 30 + 'ms"><span class="szl">Large · detailed</span>' + body + '</article>';
  }
  function smallCard(a, i) {
    return '<article class="w w--s ' + (TONE[a.id] || '') + '" style="--c:' + esc(a.colour) + ';animation-delay:' + Math.min(i, 12) * 30 + 'ms"><span class="szl">Small · simple</span>' + small(a) + '</article>';
  }
  function render() {
    var q = state.q.toLowerCase();
    var shown = apps.filter(function (a) { return (state.group === 'All' || a.group === state.group) && (!q || [a.appName, a.name, a.appSub, a.sub, a.group].join(' ').toLowerCase().indexOf(q) > -1); });
    var groups = {}; shown.forEach(function (a) { (groups[a.group] = groups[a.group] || []).push(a); });
    var keys = Object.keys(groups).sort(function (x, y) { return (ORDER.indexOf(x) + 1 || 99) - (ORDER.indexOf(y) + 1 || 99); });
    var n = 0;
    $('out').innerHTML = keys.length ? keys.map(function (g) {
      return '<div class="grp"><h2>' + esc(g) + '</h2><span>' + groups[g].length + ' modules</span></div><div class="grid grid--' + state.size + '">' + groups[g].map(function (a) {
        var i = n++; return (state.size !== 'l' ? smallCard(a, i) : '') + (state.size !== 's' ? widget(a, i) : '');
      }).join('') + '</div>';
    }).join('') : '<p class="empty">No module matches “' + esc(state.q) + '”</p>';
    $('ttlSub').textContent = shown.length + ' of ' + apps.length + ' modules · ' + siteName() + ' · named as in the ANTZ app';
  }
  function renderChips() {
    var count = function (g) { return g === 'All' ? apps.length : apps.filter(function (a) { return a.group === g; }).length; };
    var sizes = [['both', 'Both sizes'], ['s', 'Small'], ['l', 'Large']];
    $('sizes').innerHTML = sizes.map(function (x) { return '<button type="button" data-size="' + x[0] + '" aria-pressed="' + (state.size === x[0]) + '">' + x[1] + '</button>'; }).join('');
    $('chips').innerHTML = ['All'].concat(ORDER.filter(function (g) { return count(g); })).map(function (g) { return '<button type="button" class="chip" data-g="' + esc(g) + '" aria-pressed="' + (state.group === g) + '">' + esc(g) + '<span>' + count(g) + '</span></button>'; }).join('');
  }
  $('sizes').addEventListener('click', function (e) { var b = e.target.closest('[data-size]'); if (!b) return; state.size = b.dataset.size; renderChips(); render(); });
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('[data-g]'); if (!b) return; state.group = b.dataset.g; renderChips(); render(); });
  $('out').addEventListener('click', function (e) {
    var b = e.target.closest('[data-per]'); if (!b) return;
    var k = b.dataset.per.split(':'); state.period[k[0]] = k[1];
    var card = b.closest('.w'), a = apps.filter(function (x) { return x.id === k[0]; })[0];
    card.outerHTML = widget(a, 0).replace('animation-delay:0ms', 'animation:none');
  });
  $('q').addEventListener('input', function () { state.q = this.value.trim(); render(); });
  $('site').addEventListener('change', function () { state.site = this.value; render(); });
  renderChips(); render();
})();
</script>
