<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>ANTZ widget states</title>
<meta name="color-scheme" content="light dark">
<!--
  ANTZ WIDGET STATES: every widget, every size, every state, drawn by the same renderers as the app.
  config.js + data.js   the app's content and sample data
  widget-kit.js         shared renderers (the app loads the same file)
  catalogue.js          the state list for each widget, and this page's controls
  Relative paths only: works from file:// and under /app/. See README.md, "Widget states page".
-->
<script src="config.js"></script>
<script src="data.js"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search), t = q.get('theme');
    if (!t) { try { t = localStorage.getItem('antz-cat-theme'); } catch (e) { /* storage blocked */ } }
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=DM+Sans:opsz,wght@9..40,300..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="catalogue.css">
</head>
<body class="cat">
<a class="cat-skip" href="#catMain">Skip to the widgets</a>
<header class="cat-hd">
  <div class="cat-hd__t">
    <span class="side__logo" aria-hidden="true"><span class="material-symbols-outlined">pets</span></span>
    <div><h1>ANTZ widget states</h1><p>Every widget, size and state, drawn by the app’s own renderers. Sample data.</p></div>
  </div>
  <div class="cat-hd__ctl">
    <div class="cat-seg" role="radiogroup" aria-label="Theme" id="catTheme">
      <label><input type="radio" class="vh-input" name="catTheme" value="light">Light</label>
      <label><input type="radio" class="vh-input" name="catTheme" value="dark">Dark</label>
    </div>
    <label class="cat-site"><span class="material-symbols-outlined" aria-hidden="true">location_on</span><span class="vh">Site</span><select id="catSite"></select></label>
    <a class="btn btn--ghost btn--sm" href="index.html"><span class="material-symbols-outlined ico ico--sm" aria-hidden="true">arrow_back</span>Back to the app</a>
  </div>
</header>
<div class="cat-body">
  <nav class="cat-toc" aria-label="Widgets"><h2>Widgets</h2><ul id="catToc"></ul></nav>
  <main class="cat-main" id="catMain"></main>
</div>
<script src="widget-kit.js"></script>
<script src="catalogue.js"></script>
</body>
</html>
